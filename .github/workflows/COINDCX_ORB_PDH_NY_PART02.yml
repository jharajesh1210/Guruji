# PART-02: inverse (fade) NY-session ORB + PDH/PDL paper trader. Separate from COINDCX_ORB_PDH_NY_SESSION.yml (PART-01).
# Runs only around the NY session (13:20-21:10 UTC = 18:50-02:40 IST) so it uses far fewer Actions minutes than a 24h loop.
# A GitHub job can run at most 6h, so the loop ends after ~5.5h and re-dispatches itself while the window is still open.
# Cron lines are the starters/backups; concurrency keeps a single active run. Paper only: no orders are placed.
name: CoinDCX ORB PDH NY PART-02 Inverse Paper Trading

on:
  workflow_dispatch:
    inputs:
      force_one_cycle:
        description: "Run exactly one scan cycle even outside the NY window (smoke test)"
        type: boolean
        default: false
  schedule:
    - cron: "20 13 * * *"
    - cron: "5 19 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: coindcx-orb-pdh-part02
  cancel-in-progress: false

jobs:
  live-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      FORCE: ${{ inputs.force_one_cycle }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository and restore paper state
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests
      - name: Compile strategy
        run: python -m py_compile "coindcx_orb_pdh_ny_session_PART-02.py"
      - name: Run PART-02 scanner loop (every 5 min inside the NY window)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          persist() {
            for f in orb_pdh_part02_state.json orb_pdh_part02_trades.csv eligible_futures_universe_part02.csv; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            if git diff --cached --quiet; then
              return 0
            fi
            git commit -m "Update CoinDCX ORB PART-02 paper state" || return 0
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main >/dev/null 2>&1 || true
              if git push origin HEAD:main; then
                return 0
              fi
              sleep $((attempt * 3))
            done
            echo "WARN: could not push state this cycle; will retry next cycle."
            return 0
          }

          END=$(( $(date +%s) + 19800 ))
          cycle=0
          while [ "$(date +%s)" -lt "$END" ]; do
            hm=$((10#$(date -u +%H%M)))
            if [ "$FORCE" != "true" ] && { [ "$hm" -lt 1320 ] || [ "$hm" -ge 2110 ]; }; then
              echo "Outside the NY window (13:20-21:10 UTC); nothing to do now (UTC time $hm)."
              break
            fi
            cycle=$((cycle + 1))
            START=$(date +%s)
            echo "=== cycle ${cycle} @ $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            if ! timeout 600 python -u "coindcx_orb_pdh_ny_session_PART-02.py" --mode live-paper; then
              echo "WARN: cycle ${cycle} failed or timed out; continuing."
            fi
            persist
            if [ "$FORCE" = "true" ]; then
              break
            fi
            NEXT=$(( (START / 300 + 1) * 300 ))
            NOW=$(date +%s)
            if [ "$NEXT" -gt "$NOW" ]; then
              sleep $((NEXT - NOW))
            fi
          done
          echo "Loop finished after ${cycle} cycles."
      - name: Re-dispatch while the NY session is still open
        if: success() || failure()
        run: |
          hm=$((10#$(date -u +%H%M)))
          if [ "$FORCE" != "true" ] && [ "$hm" -ge 1320 ] && [ "$hm" -lt 2100 ]; then
            echo "NY window still open (UTC $hm); starting the next run."
            gh workflow run COINDCX_ORB_PDH_NY_PART02.yml --repo "${{ github.repository }}" --ref main
          else
            echo "No re-dispatch needed (UTC $hm)."
          fi
