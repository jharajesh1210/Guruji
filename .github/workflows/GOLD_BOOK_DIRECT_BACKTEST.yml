name: GOLD_BOOK.py Direct Partial History Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gold-book-direct-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas numpy requests
      - name: Backtest original GOLD_BOOK.py on CoinDCX
        run: |
          set -o pipefail
          python GOLD_BOOK.py --days 365 --risk-usd 10 --allow-partial-history 2>&1 | tee GOLD_BOOK_DIRECT_BACKTEST.log
      - name: Save results even if backtest fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-book-partial-history-results
          path: |
            GOLD_BOOK_DIRECT_BACKTEST.log
            GOLD_BOOK_ALL_TRADES.csv
            XAUUSDT_TRADES.csv
            PAXGUSDT_TRADES.csv
          if-no-files-found: warn
