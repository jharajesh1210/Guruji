name: SMC Sectorial Angel One Paper Trading

on:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smc-sectorial-angel-paper
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      TG_TOKEN: ${{ secrets.TG_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID || secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install smartapi-python pyotp requests pandas numpy

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in ANGEL_API_KEY ANGEL_CLIENT_CODE ANGEL_PIN ANGEL_TOTP_SECRET TG_TOKEN TG_CHAT_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required secret(s): %s\n' "$(IFS=', '; echo "${missing[*]}")"
            echo "Set one supported Telegram token secret (TG_TOKEN / TELEGRAM_BOT_TOKEN / BOT_TOKEN) and one chat ID secret (TG_CHAT_ID / TELEGRAM_CHAT_ID / CHAT_ID) in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "All required Angel One and Telegram secrets are available."

      - name: Run Angel One SMC paper strategy
        run: python smc_sectorial_strategy.py

      - name: Persist paper state and trade log
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in SMC_SECTORIAL_PAPER_STATE.json SMC_SECTORIAL_PAPER_TRADES.csv; do
            if [ -f "$file" ]; then git add -f "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update SMC sectorial paper trading state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
