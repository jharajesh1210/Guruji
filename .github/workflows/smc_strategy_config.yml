name: SMC Sectorial Angel One Paper Trading

on:
  schedule:
    # Every 5 minutes during the Indian market-day window (GitHub cron is UTC).
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smc-sectorial-angel-paper
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Keep existing saved secret names; values remain in GitHub Secrets.
      ANGEL_API_KEY: ${{ secrets.AKPVIim8 }}
      ANGEL_CLIENT_CODE: ${{ secrets.AACN705705 }}
      ANGEL_PIN: ${{ secrets.1210 }}
      ANGEL_TOTP_SECRET: ${{ secrets.NZWAVIQQTMLUFLPOV3AXVJ6MBY }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install smartapi-python pyotp requests pandas numpy

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANGEL_API_KEY"
          test -n "$ANGEL_CLIENT_CODE"
          test -n "$ANGEL_PIN"
          test -n "$ANGEL_TOTP_SECRET"
          test -n "$TG_TOKEN"
          test -n "$TG_CHAT_ID"

      - name: Run Angel One SMC paper strategy
        run: python smc_sectorial_strategy.py

      - name: Persist paper state and trade log
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in SMC_SECTORIAL_PAPER_STATE.json SMC_SECTORIAL_PAPER_TRADES.csv; do
            if [ -f "$file" ]; then git add -f "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update SMC sectorial paper trading state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
