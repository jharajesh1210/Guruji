name: Run SMC Trading Strategy

on:
  schedule:
    # Har 15 minute mein automated trigger karne ke liye (cron schedule)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Manual trigger ke liye

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy ta ccxt yfinance

    - name: Run Strategy Script
      run: |
        python smc_sectorial_strategy.py
