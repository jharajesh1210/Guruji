name: CoinDCX ORB PDH PDL NY Session Paper Backtest

on:
  workflow_dispatch:
    inputs:
      pair:
        description: "CoinDCX futures pair (example: B-BTC_USDT)"
        required: true
        default: "B-BTC_USDT"
        type: string
      days:
        description: "Historical days to fetch"
        required: true
        default: "14"
        type: string

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests
      - name: Compile strategy
        run: python -m py_compile coindcx_orb_pdh_ny_session.py
      - name: Run CoinDCX NY session paper backtest
        env:
          PAIR: ${{ inputs.pair }}
          DAYS: ${{ inputs.days }}
        run: |
          python -u coindcx_orb_pdh_ny_session.py --pair "$PAIR" --days "$DAYS" --csv ny_session_trades.csv
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CoinDCX_ORB_PDH_PDL_NY_${{ github.run_number }}
          path: ny_session_trades.csv
          if-no-files-found: warn
          retention-days: 30
