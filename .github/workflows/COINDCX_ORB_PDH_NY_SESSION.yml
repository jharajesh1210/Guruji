name: CoinDCX ORB PDH PDL NY Session Live Paper Trading

on:
  workflow_dispatch:
  schedule:
    - cron: "2/5 * * * *"

permissions:
  contents: write

concurrency:
  group: coindcx-orb-pdh-live-paper
  cancel-in-progress: false

jobs:
  live-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository and restore paper state
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests
      - name: Compile and run live paper scanner
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python -m py_compile coindcx_orb_pdh_ny_session.py
          python -u coindcx_orb_pdh_ny_session.py --mode live-paper
      - name: Verify Telegram delivery on manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.getenv("TG_TOKEN") or os.getenv("BOT_TOKEN")
          chat_id = os.getenv("TG_CHAT_ID") or os.getenv("CHAT_ID")
          if not token or not chat_id:
              raise SystemExit("Telegram credentials missing: configure BOT_TOKEN and CHAT_ID (or TG_TOKEN and TG_CHAT_ID) in GitHub Actions Secrets.")

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data={
                  "chat_id": chat_id,
                  "text": "✅ CoinDCX ORB PDH PDL NY Session: Telegram delivery test successful. Scanner mode: LIVE PAPER; no live orders are placed."
              },
              timeout=20,
          )
          response.raise_for_status()
          result = response.json()
          if not result.get("ok"):
              raise SystemExit(f"Telegram rejected the message: {result}")
          print("Telegram delivery confirmed by Telegram API.")
          PY
      - name: Persist paper state and trades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orb_pdh_live_state.json orb_pdh_live_trades.csv eligible_futures_universe.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update CoinDCX ORB live paper state"
            git push
          fi
      - name: Upload paper trading records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CoinDCX_ORB_PDH_Live_Paper
          path: |
            orb_pdh_live_state.json
            orb_pdh_live_trades.csv
            eligible_futures_universe.csv
          if-no-files-found: warn
          retention-days: 30
