name: CoinDCX ORB PDH PDL NY Session Live Paper Trading

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: coindcx-orb-pdh-live-paper
  cancel-in-progress: false

jobs:
  live-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository and restore paper state
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests
      - name: Compile and run live paper scanner
        env:
          TG_TOKEN: \${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: \${{ secrets.TG_CHAT_ID }}
          BOT_TOKEN: \${{ secrets.BOT_TOKEN }}
          CHAT_ID: \${{ secrets.CHAT_ID }}
        run: |
          python -m py_compile coindcx_orb_pdh_ny_session.py
          python -u coindcx_orb_pdh_ny_session.py --mode live-paper
      - name: Persist paper state and trades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orb_pdh_live_state.json orb_pdh_live_trades.csv eligible_futures_universe.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update CoinDCX ORB live paper state"
            git push
          fi
      - name: Upload paper trading records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CoinDCX_ORB_PDH_Live_Paper_\${{ github.run_number }}
          path: |
            orb_pdh_live_state.json
            orb_pdh_live_trades.csv
            eligible_futures_universe.csv
          if-no-files-found: warn
          retention-days: 30
