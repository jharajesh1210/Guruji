# Self-sustaining runner: GitHub's "*/5" schedule is unreliable (often never fires),
# so one job loops internally every 5 minutes for ~5.5h and then re-dispatches itself.
# The schedule below is only a backup starter; concurrency keeps a single active run.
name: CoinDCX ORB PDH PDL NY Session Live Paper Trading

on:
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send a Telegram delivery test message"
        type: boolean
        default: false
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: coindcx-orb-pdh-live-paper
  cancel-in-progress: false

jobs:
  live-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout repository and restore paper state
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Show workflow trigger diagnostics
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "UTC time:"
          date -u
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests
      - name: Compile strategy
        run: python -m py_compile coindcx_orb_pdh_ny_session.py
      - name: Verify Telegram delivery (manual test only)
        if: github.event_name == 'workflow_dispatch' && inputs.telegram_test == true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.getenv("TG_TOKEN") or os.getenv("BOT_TOKEN")
          chat_id = os.getenv("TG_CHAT_ID") or os.getenv("CHAT_ID")
          if not token or not chat_id:
              raise SystemExit("Telegram credentials missing: configure BOT_TOKEN and CHAT_ID (or TG_TOKEN and TG_CHAT_ID) in GitHub Actions Secrets.")

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data={
                  "chat_id": chat_id,
                  "text": "✅ CoinDCX ORB PDH PDL NY Session: Telegram delivery test successful. Scanner mode: LIVE PAPER; no live orders are placed."
              },
              timeout=20,
          )
          response.raise_for_status()
          result = response.json()
          if not result.get("ok"):
              raise SystemExit(f"Telegram rejected the message: {result}")
          print("Telegram delivery confirmed by Telegram API.")
          PY
      - name: Run live paper scanner loop (every 5 min, ~5.5h)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Launcher: GitHub's own cron rarely fires for the NIFTY50 workflows, so this always-alive
          # runner starts them on NSE days (Mon-Fri, 03:35-09:55 UTC = 09:05-15:25 IST) when none is active.
          # max_runs caps how many runs may be created per UTC day (cron + manual + launcher all count).
          ensure_workflow() {
            local wf="$1" max_runs="$2" dow hm today active runs
            dow=$(date -u +%u)
            hm=$((10#$(date -u +%H%M)))
            if [ "$dow" -gt 5 ] || [ "$hm" -lt 335 ] || [ "$hm" -gt 955 ]; then
              return 0
            fi
            active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --limit 20 --json status \
              --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending")] | length') || return 0
            if [ "$active" != "0" ]; then
              return 0
            fi
            today=$(date -u +%Y-%m-%d)
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --limit 40 --json createdAt \
              --jq "[.[] | select(.createdAt >= \"${today}T03:00:00Z\")] | length") || return 0
            if [ "$runs" -ge "$max_runs" ]; then
              return 0
            fi
            echo "Launcher: starting ${wf} (runs today so far: ${runs})"
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref main || echo "WARN: could not dispatch ${wf}"
          }

          persist() {
            git add orb_pdh_live_state.json orb_pdh_live_trades.csv eligible_futures_universe.csv 2>/dev/null || true
            if git diff --cached --quiet; then
              return 0
            fi
            git commit -m "Update CoinDCX ORB live paper state" || return 0
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main >/dev/null 2>&1 || true
              if git push origin HEAD:main; then
                return 0
              fi
              sleep $((attempt * 3))
            done
            echo "WARN: could not push state this cycle; will retry next cycle."
            return 0
          }

          END=$(( $(date +%s) + 19800 ))
          cycle=0
          while [ "$(date +%s)" -lt "$END" ]; do
            cycle=$((cycle + 1))
            START=$(date +%s)
            echo "=== cycle ${cycle} @ $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            if ! timeout 600 python -u coindcx_orb_pdh_ny_session.py --mode live-paper; then
              echo "WARN: cycle ${cycle} failed or timed out; continuing."
            fi
            persist
            ensure_workflow ORB_PDH_NIFTY50_PAPER.yml 14
            ensure_workflow NIFTY50_ANGELONE_PAPER.yml 3
            NEXT=$(( (START / 300 + 1) * 300 ))
            NOW=$(date +%s)
            if [ "$NEXT" -gt "$NOW" ]; then
              sleep $((NEXT - NOW))
            fi
          done
          echo "Loop finished after ${cycle} cycles."
      - name: Upload paper trading records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CoinDCX_ORB_PDH_Live_Paper_${{ github.run_number }}
          path: |
            orb_pdh_live_state.json
            orb_pdh_live_trades.csv
            eligible_futures_universe.csv
          if-no-files-found: warn
          retention-days: 7
      - name: Re-dispatch to keep the runner alive
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run COINDCX_ORB_PDH_NY_SESSION.yml --repo "${{ github.repository }}" --ref main
