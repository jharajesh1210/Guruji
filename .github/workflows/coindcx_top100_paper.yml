name: CoinDCX Top100 Paper 15m
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coindcx-top100-paper
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas numpy
      - name: Run CoinDCX paper only
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOP: '100'
          MIN_SCORE: '5'
        run: python coindcx_top100_paper.py
      - name: Save paper ledger for next run
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f coindcx_top100_paper_state.json && git add coindcx_top100_paper_state.json
          test ! -f coindcx_top100_paper_trades.csv || git add coindcx_top100_paper_trades.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update CoinDCX paper positions and trades [skip ci]"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Paper ledger rebase conflict; refusing to overwrite trade history."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Paper ledger saved successfully"
                exit 0
              fi
              echo "Push race on attempt $attempt; retrying..."
              sleep $((attempt * 2))
            done
            echo "::error::Could not save paper ledger after 5 attempts"
            exit 1
          fi
      - name: Upload paper ledger backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coindcx-top100-paper-ledger-${{ github.run_id }}
          path: |
            coindcx_top100_paper_state.json
            coindcx_top100_paper_trades.csv
          if-no-files-found: warn
