name: NIFTY50 EQUITY INTRADAY PAPER SCANNER

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Select scanner mode"
        required: true
        default: paper
        type: choice
        options:
          - paper
          - scan

  schedule:
    # GitHub cron uses UTC and often runs late or skips ticks.
    # A backup run is triggered every 30 min (09:30 to 15:00 IST). Only ONE runs at a time;
    # the next one waits in queue and takes over the moment the running one stops or breaks.
    - cron: "*/30 4-9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nifty50-equity-paper
  cancel-in-progress: false

jobs:
  nifty50:
    name: Run NIFTY50 Equity Intraday Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 170

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests yfinance

      - name: Verify Python File
        run: |
          test -f NIFTY50_EQUITY_INTRADAY.py
          python -m py_compile NIFTY50_EQUITY_INTRADAY.py

      - name: Scan once (manual scan mode)
        if: github.event.inputs.mode == 'scan'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u NIFTY50_EQUITY_INTRADAY.py --mode scan | tee NIFTY50_RUN_LOG.txt

      - name: Paper loop every 5 minutes
        if: github.event.inputs.mode != 'scan'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        shell: bash
        run: |
          # Never let one failed command kill the loop
          set +e
          set +o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="NIFTY50_EQUITY_PAPER_STATE.json NIFTY50_EQUITY_PAPER_TRADES.csv NIFTY50_EQUITY_PAPER_EVENTS.csv NIFTY50_EQUITY_SIGNALS.csv"

          tg () {
            if [ -n "$BOT_TOKEN" ] && [ -n "$CHAT_ID" ]; then
              curl -s -m 15 -o /dev/null -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${CHAT_ID}" --data-urlencode "text=$1"
            fi
          }

          save_files () {
            mkdir -p /tmp/nifty-save
            for f in $FILES; do if [ -f "$f" ]; then cp "$f" /tmp/nifty-save/; fi; done
            for attempt in 1 2 3 4 5; do
              git fetch -q origin main && git reset -q --hard origin/main
              cp /tmp/nifty-save/* . 2>/dev/null
              for f in $FILES; do if [ -f "$f" ]; then git add -f "$f"; fi; done
              if git diff --cached --quiet; then echo "No changes to save"; return 0; fi
              git commit -q -m "Update NIFTY50 equity paper results [skip ci]"
              if git push -q origin HEAD:main; then echo "Saved"; return 0; fi
              echo "Push failed, retry $attempt"; sleep $((attempt * 3))
            done
            echo "WARNING: could not save this round (will try again next round)"
          }

          # Each run works max ~150 min (GitHub limit safety), never past 15:35 IST.
          # When it ends, the queued backup run continues from the saved state.
          END_EPOCH=$(( $(date +%s) + 150*60 ))
          FAILS=0; ROUNDS=0; DAY_OVER=0
          echo "Run started at $(TZ=Asia/Kolkata date +%H:%M) IST"

          while true; do
            NOW=$(TZ=Asia/Kolkata date +%H:%M)
            if [[ "$NOW" > "15:35" ]]; then echo "Market session over at $NOW IST"; DAY_OVER=1; break; fi
            if [ "$(date +%s)" -ge "$END_EPOCH" ]; then echo "Handing over to next queued run"; break; fi
            echo "===== Round at $NOW IST ====="
            python -u NIFTY50_EQUITY_INTRADAY.py --mode paper > /tmp/round.log 2>&1
            CODE=$?
            cat /tmp/round.log | tee -a NIFTY50_RUN_LOG.txt
            ROUNDS=$((ROUNDS + 1))
            if [ "$CODE" -ne 0 ]; then
              FAILS=$((FAILS + 1))
              echo "Python error (exit $CODE), consecutive fails: $FAILS"
              if [ "$FAILS" -eq 3 ]; then
                tg "⚠️ NIFTY50 PAPER bot me lagatar 3 baar error aaya ($NOW IST). Bot rukega nahi, dobara koshish karta rahega. Last error: $(tail -n 3 /tmp/round.log)"
              fi
            else
              if [ "$FAILS" -ge 3 ]; then tg "✅ NIFTY50 PAPER bot wapas theek chal raha hai ($NOW IST)"; fi
              FAILS=0
            fi
            save_files
            # Sleep till 30 sec after the next 5-minute mark (gives Yahoo time to publish the candle)
            SEC=$(( 300 - ($(date +%s) % 300) + 30 ))
            sleep $SEC
          done

          # End-of-day heartbeat on Telegram (only from the run that finished the day)
          if [ "$DAY_OVER" = "1" ] && [ "$ROUNDS" -gt 0 ] && [ -n "$BOT_TOKEN" ] && [ -n "$CHAT_ID" ]; then
            SUMMARY=$(python - <<'PY'
          import json, csv, datetime
          from pathlib import Path
          today = datetime.datetime.utcnow() + datetime.timedelta(hours=5, minutes=30)
          today = today.date().isoformat()
          s = json.loads(Path('NIFTY50_EQUITY_PAPER_STATE.json').read_text())
          sig = 0
          p = Path('NIFTY50_EQUITY_SIGNALS.csv')
          if p.exists():
              sig = sum(1 for r in csv.DictReader(p.open()) if r['time'].startswith(today))
          print(f"NIFTY50 PAPER - din ka summary {today}\nBot chala: haan\nAaj ke signal: {sig}\nKhule trade: {len(s.get('positions', {}))}\nAaj ka P&L: INR {s.get('day_pnl', {}).get('pnl', 0)}\nKul equity: INR {s.get('equity')}")
          PY
            )
            curl -s -o /dev/null -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" --data-urlencode "text=${SUMMARY}" || true
          fi

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY50_EQUITY_INTRADAY_REPORTS
          path: |
            NIFTY50_RUN_LOG.txt
            NIFTY50_EQUITY_PAPER_STATE.json
            NIFTY50_EQUITY_PAPER_TRADES.csv
            NIFTY50_EQUITY_PAPER_EVENTS.csv
            NIFTY50_EQUITY_SIGNALS.csv
          if-no-files-found: warn
          retention-days: 30
