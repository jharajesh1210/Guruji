
name: NEWS ENGINE DIAGNOSTIC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install requests

      - name: Test actual News Impact Engine
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from datetime import datetime, timedelta, timezone

          import NEWS_IMPACT_ENGINE as engine

          print("========== NEWS ENGINE TEST ==========")

          now = datetime.now(timezone.utc)
          print("UTC NOW:", now.isoformat())

          events, error = engine._calendar(now)

          if error:
              print("CALENDAR STATUS: BLOCKED")
              print("REASON:", error)
              print("FAIL-CLOSED: PASS")
              sys.exit(1)

          print("CALENDAR STATUS: OK")
          print("EVENTS:", len(events))

          future = [
              e for e in events
              if e["time"] > now + timedelta(minutes=40)
          ]

          if not future:
              print("NO FUTURE EVENT AVAILABLE FOR TEST")
              sys.exit(1)

          event = min(
              future,
              key=lambda e: e["time"]
          )

          print("TEST EVENT:", event["title"])
          print("EVENT UTC:", event["time"])

          def check(label, test_time, expected):
              blocked, reason = engine.entry_decision(
                  "B-BTC_USDT",
                  "LONG",
                  now=test_time
              )

              print("-----------------------------------")
              print(label)
              print("BLOCKED:", blocked)
              print("REASON:", reason)

              passed = blocked == expected
              print("RESULT:", "PASS" if passed else "FAIL")
              return passed

          results = []

          results.append(check(
              "15 MIN BEFORE NEWS",
              event["time"] - timedelta(minutes=15),
              True
          ))

          results.append(check(
              "15 MIN AFTER NEWS",
              event["time"] + timedelta(minutes=15),
              True
          ))

          # Simulate a verified BTC LONG reaction.
          # No CoinDCX request or order is made here.
          original_reaction = engine._btc_reaction

          try:
              engine._btc_reaction = (
                  lambda event_time, current_time:
                  ("LONG", "SIMULATED BTC LONG")
              )

              results.append(check(
                  "60 MIN AFTER NEWS - BTC LONG",
                  event["time"] + timedelta(minutes=60),
                  False
              ))

              engine._btc_reaction = (
                  lambda event_time, current_time:
                  ("SHORT", "SIMULATED BTC SHORT")
              )

              results.append(check(
                  "60 MIN AFTER NEWS - BTC SHORT",
                  event["time"] + timedelta(minutes=60),
                  True
              ))

          finally:
              engine._btc_reaction = original_reaction

          print("===================================")

          if all(results):
              print("FINAL RESULT: ALL TESTS PASSED")
          else:
              print("FINAL RESULT: TEST FAILED")
              sys.exit(1)

          print("DIAGNOSTIC ONLY - NO TRADES PLACED")
          PY
