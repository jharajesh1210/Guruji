
name: NEWS ENGINE DIAGNOSTIC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Free Economic Calendar API
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timedelta, timezone

          print("========== FREE CALENDAR TEST ==========")
          print("SOURCE: https://www.financecalendar.com")
          print("UTC NOW:", datetime.now(timezone.utc).isoformat())

          today = datetime.now(timezone.utc).date()
          start = (today - timedelta(days=1)).isoformat()
          end = (today + timedelta(days=30)).isoformat()

          url = (
              "https://www.financecalendar.com/wp-json/fc/v1/calendar"
              f"?country=US&impact=high&from={start}&to={end}&limit=500"
          )

          try:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Guruji-News-Diagnostic/1.0"}
              )

              with urllib.request.urlopen(request, timeout=20) as response:
                  print("HTTP STATUS:", response.status)
                  data = json.load(response)

              events = data.get("events", [])
              if not isinstance(events, list):
                  raise ValueError("Invalid events format")

              print("TOTAL RETURNED EVENTS:", len(events))
              print("TOTAL AVAILABLE:", data.get("total", "unknown"))

              keywords = (
                  "cpi", "consumer price",
                  "ppi", "producer price",
                  "nonfarm", "non-farm", "payroll",
                  "fomc", "federal funds",
                  "interest rate", "fed rate"
              )

              matched = []

              for event in events:
                  title = str(
                      event.get("title")
                      or event.get("name")
                      or event.get("event")
                      or ""
                  )

                  series = str(event.get("series", ""))
                  combined = (title + " " + series).lower()

                  if any(word in combined for word in keywords):
                      matched.append(event)

              print("TARGET EVENTS FOUND:", len(matched))
              print("--------------------------------------")

              for event in matched[:20]:
                  print("EVENT:", json.dumps(
                      event, ensure_ascii=False, default=str
                  )[:1500])

              exact = [
                  event for event in matched
                  if event.get("release_at_utc")
                  or event.get("time_utc")
              ]

              print("--------------------------------------")
              print("TARGET EVENTS WITH TIME:", len(exact))

              if not events:
                  print("RESULT: INCOMPLETE - NO EVENTS")
              elif not matched:
                  print("RESULT: INCOMPLETE - TARGET EVENTS NOT FOUND")
              elif not exact:
                  print("RESULT: INCOMPLETE - EXACT TIMES MISSING")
              else:
                  print("RESULT: API ACCESS OK")
                  print("NOTE: EVENT ACCURACY STILL NEEDS VERIFICATION")

          except Exception as exc:
              print("RESULT: API TEST FAILED")
              print("ERROR:", repr(exc))

          print("======================================")
          print("DIAGNOSTIC ONLY - NO TRADES PLACED")
          PY
