
name: GOLD COMBO STRATEGY PAPER

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gold-strategy:
    name: Gold Strategy Backtest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Check strategy file
        run: |
          test -f gold_combo_strategy.py
          python -m py_compile gold_combo_strategy.py

      - name: XAU 90 Day Backtest
        run: |
          python gold_combo_strategy.py backtest \
            --symbol XAU \
            --fetch \
            --days 90 \
            --save-trades GOLD_XAU_90DAY_TRADES.csv

      - name: PAXG 90 Day Backtest
        run: |
          python gold_combo_strategy.py backtest \
            --symbol PAXG \
            --fetch \
            --days 90 \
            --save-trades GOLD_PAXG_90DAY_TRADES.csv

      - name: Upload Backtest Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD_STRATEGY_90DAY_RESULTS
          path: |
            GOLD_XAU_90DAY_TRADES.csv
            GOLD_PAXG_90DAY_TRADES.csv
          if-no-files-found: warn
          retention-days: 30
