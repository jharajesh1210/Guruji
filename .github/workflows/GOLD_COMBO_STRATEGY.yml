
name: GOLD COMBO STRATEGY PAPER

on:
  workflow_dispatch:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read

concurrency:
  group: gold-combo-strategy-paper
  cancel-in-progress: false

jobs:
  gold-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests

      - name: Verify Python file
        run: |
          test -f gold_combo_strategy.py
          python -m py_compile gold_combo_strategy.py

      - name: Scan XAU USDT
        run: |
          python -u gold_combo_strategy.py scan --symbol XAU --fetch --days 30

      - name: Scan PAXG USDT
        if: always()
        run: |
          python -u gold_combo_strategy.py scan --symbol PAXG --fetch --days 30
