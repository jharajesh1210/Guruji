
name: ASIAN LONDON NY NEWS IMPACT PAPER

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: guruji-paper-scanners
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas numpy

      - name: Verify Python files
        run: |
          test -f ASIAN_LONDON_NY_PAPER_NEWS_IMPACT.py
          test -f NEWS_IMPACT_ENGINE.py
          python -m py_compile \
            ASIAN_LONDON_NY_PAPER_NEWS_IMPACT.py \
            NEWS_IMPACT_ENGINE.py

      - name: Run Asian London NY News scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          NEWS_CALENDAR_URL: ${{ secrets.NEWS_CALENDAR_URL }}
        run: |
          python -u ASIAN_LONDON_NY_PAPER_NEWS_IMPACT.py

      - name: Save paper trading files
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PREFIX="ASIAN_LONDON_NY_PAPER_NEWS_IMPACT"

          echo "Checking generated files..."
          ls -lh "${PREFIX}"_*.json "${PREFIX}"_*.csv 2>/dev/null || true

          if [ ! -f "${PREFIX}_state.json" ]; then
            echo "ERROR: State file not created"
            exit 1
          fi

          git add -f "${PREFIX}_state.json"

          for file in \
            "${PREFIX}_trades.csv" \
            "${PREFIX}_signals.csv" \
            "${PREFIX}_news_skips.csv"
          do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "NO CHANGES TO COMMIT"
          else
            git commit -m "Update Asian London NY News Impact paper data"
            git push origin HEAD:main
            echo "PAPER FILES PUSHED SUCCESSFULLY"
          fi

      - name: Verify state file
        if: success()
        run: |
          test -f ASIAN_LONDON_NY_PAPER_NEWS_IMPACT_state.json
          echo "NEWS IMPACT STATE FILE EXISTS"
          ls -lh ASIAN_LONDON_NY_PAPER_NEWS_IMPACT_state.json
