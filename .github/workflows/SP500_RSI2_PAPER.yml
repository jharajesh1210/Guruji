# Daily SPY RSI(2) mean-reversion PAPER scanner (no real orders).
# Runs after the US close (21:30 UTC, Mon-Fri). It processes every completed daily bar it has not seen yet,
# so a delayed or skipped scheduled run simply catches up on the next one.
# State and trades are committed to sp500_rsi2_state.json / sp500_rsi2_trades.csv.
name: SP500 RSI2 Paper Scanner

on:
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Only send a Telegram delivery test message"
        type: boolean
        default: false
  schedule:
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: sp500-rsi2-paper
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository and restore paper state
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests yfinance
      - name: Telegram delivery test (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.telegram_test == true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u sp500_rsi2_paper_scanner.py --telegram-test
      - name: Run RSI(2) paper scanner
        if: github.event_name != 'workflow_dispatch' || inputs.telegram_test != true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u sp500_rsi2_paper_scanner.py
      - name: Save paper state
        if: github.event_name != 'workflow_dispatch' || inputs.telegram_test != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sp500_rsi2_state.json sp500_rsi2_trades.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "Update SP500 RSI2 paper state"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin main >/dev/null 2>&1 || true
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "WARN: could not push state; it will be recomputed on the next run."
