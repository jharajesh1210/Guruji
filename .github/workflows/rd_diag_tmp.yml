name: rd_diag_tmp
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Inspect CoinDCX volume fields
        run: |
          python - <<'EOF'
          import requests, time, statistics
          P="https://public.coindcx.com/market_data/v3/current_prices/futures/rt"
          d=requests.get(P,timeout=30).json()
          pr=d.get("prices",{})
          usdt={k:v for k,v in pr.items() if k.startswith("B-") and k.endswith("_USDT")}
          print("TOTAL_USDT_PAIRS",len(usdt))
          print("SAMPLE_KEYS",list(next(iter(usdt.values())).keys()))
          rows=sorted(((float(v.get("v",0)),k,v) for k,v in usdt.items()),reverse=True)
          for i in (0,1,2,10,30,60,100,129,150,200,len(rows)-1):
              if i<len(rows): print("RANK",i,rows[i][1],rows[i][2])
          for thr in (1e6,1e7,1e8):
              print("COUNT v>",thr,sum(1 for r in rows if r[0]>thr))
          for pair in [rows[0][1],rows[1][1],rows[60][1],rows[129][1],rows[min(200,len(rows)-1)][1]]:
              now=int(time.time())
              c=requests.get("https://public.coindcx.com/market_data/candlesticks",params={"pair":pair,"from":now-86400,"to":now,"resolution":"15","pcode":"f"},timeout=30).json()
              raw=c.get("data",c) if isinstance(c,dict) else c
              vol=sum(float(x["volume"]) for x in raw); q=sum(float(x["volume"])*float(x["close"]) for x in raw)
              print("CANDLE24H",pair,"n=",len(raw),"sum_vol=",round(vol,2),"sum_vol*close=",round(q,2),"ticker_v=",usdt[pair].get("v"),"ltp=",usdt[pair].get("ls"))
          EOF
