name: BTC Dual LONG-SHORT Pullback 365D 5M 30X PAPER BACKTEST

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  btc-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests
      - name: Compile existing BTC script
        run: python -m py_compile BTC_FUTURES_DONCHIAN_BACKTEST_30X.py
      - name: Send Telegram connectivity test (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TG_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::error::GitHub Secrets TG_TOKEN and TG_CHAT_ID must both be configured."
            exit 1
          fi
          python -u BTC_FUTURES_DONCHIAN_BACKTEST_30X.py --test-telegram
      - name: Run BTC dual LONG-SHORT pullback backtest
        if: github.event_name != 'workflow_dispatch'
        run: |
          python -u BTC_FUTURES_DONCHIAN_BACKTEST_30X.py --days 365 --capital 1000 --margin 100 --leverage 30 --funding-rate 0.0001 --maintenance-margin-rate 0.005 --out BTC_DUAL_PULLBACK_RESULTS | tee BTC_BACKTEST_LOG.txt
      - name: Upload BTC results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTC_DUAL_PULLBACK_365D_30X
          path: |
            BTC_BACKTEST_LOG.txt
            BTC_DUAL_PULLBACK_RESULTS/
          if-no-files-found: warn
          retention-days: 30
