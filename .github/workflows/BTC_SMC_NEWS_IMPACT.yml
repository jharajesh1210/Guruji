
name: BTC SMC NEWS IMPACT PAPER

on:
  workflow_dispatch:
  schedule:
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-smc-news-impact
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas numpy

      - name: Verify scanner files
        run: |
          test -f BTC_SMC_Paper_NEWS_IMPACT.py
          test -f NEWS_IMPACT_ENGINE.py
          python -m py_compile \
            BTC_SMC_Paper_NEWS_IMPACT.py \
            NEWS_IMPACT_ENGINE.py

      - name: Run BTC SMC News scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          NEWS_CALENDAR_URL: ${{ secrets.NEWS_CALENDAR_URL }}
        run: |
          set +e
          python -u BTC_SMC_Paper_NEWS_IMPACT.py > run.log 2>&1
          CODE=$?
          cat run.log
          if [ "$CODE" -ne 0 ]; then
            # Show the error on the GitHub run page (Annotations) so it can be read easily
            echo "::error title=BTC news scanner error::$(tail -n 15 run.log | tr '\n' '|' | cut -c1-900)"
          fi
          exit $CODE

      - name: Save paper trading files
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PREFIX="BTC_SMC_Paper_NEWS_IMPACT"
          STATE="${PREFIX}_state.json"

          if [ ! -f "$STATE" ]; then
            echo "ERROR: State file not created"
            exit 1
          fi

          mkdir -p /tmp/btc-smc-news-save

          for file in \
            "${PREFIX}_state.json" \
            "${PREFIX}_trades.csv" \
            "${PREFIX}_signals.csv" \
            "${PREFIX}_news_skips.csv"
          do
            if [ -f "$file" ]; then
              cp "$file" /tmp/btc-smc-news-save/
            fi
          done

          for attempt in 1 2 3 4 5; do
            echo "SAVE ATTEMPT: $attempt"

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/btc-smc-news-save/* .

            for file in \
              "${PREFIX}_state.json" \
              "${PREFIX}_trades.csv" \
              "${PREFIX}_signals.csv" \
              "${PREFIX}_news_skips.csv"
            do
              if [ -f "$file" ]; then
                git add -f "$file"
              fi
            done

            if git diff --cached --quiet; then
              echo "NO CHANGES TO SAVE"
              exit 0
            fi

            git commit -m "Update BTC SMC News Impact paper data"

            if git push origin HEAD:main; then
              echo "PAPER FILES SAVED SUCCESSFULLY"
              exit 0
            fi

            echo "Push conflict. Retrying..."
            sleep 3
          done

          echo "ERROR: Could not save paper files"
          exit 1

      - name: Verify state file
        if: success()
        run: |
          test -f BTC_SMC_Paper_NEWS_IMPACT_state.json
          echo "STATE FILE EXISTS"
          ls -lh BTC_SMC_Paper_NEWS_IMPACT_state.json
