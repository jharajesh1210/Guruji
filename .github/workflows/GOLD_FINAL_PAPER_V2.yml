name: GOLD FINAL PAPER V2

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: gold-final-paper-v2
  cancel-in-progress: false

jobs:
  gold-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Restore paper-trading state
        uses: actions/cache@v4
        with:
          path: |
            GOLD_FINAL_PAPER_STATE.json
            GOLD_FINAL_PAPER_TRADES.csv
          key: gold-final-paper-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            gold-final-paper-state-${{ github.ref_name }}-

      - name: Run GOLD paper scanner
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GOLD_CAPITAL: "1000"
          GOLD_POSITION_USDT: "500"
          GOLD_REQUESTED_LEVERAGE: "30"
          GOLD_NEWS_MODE: "approx"
          GOLD_MARKET_MODE: "off"
          GOLD_ALLOW_PROXY_A: "1"
          GOLD_MAX_COST_R: "1.0"
        run: |
          python GOLD_FINAL_PAPER_V2.py

      - name: Upload paper-trading records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-final-paper-v2-${{ github.run_number }}
          path: |
            GOLD_FINAL_PAPER_TRADES.csv
            GOLD_FINAL_PAPER_STATE.json
          if-no-files-found: warn
          retention-days: 30
