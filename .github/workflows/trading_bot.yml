name: CoinDCX Futures Bot

on:
  schedule:
    - cron: '*/15 * * * *'  # Har 15 minute par run hoga
  workflow_dispatch:        # Manual run button ke liye

jobs:
  run-strategy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas pandas-ta

    - name: Run Bot Script
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        COINDCX_API_KEY: ${{ secrets.COINDCX_API_KEY }}
        COINDCX_SECRET_KEY: ${{ secrets.COINDCX_SECRET_KEY }}
      run: |
        set -o pipefail
        python coindcx_futures_strategy.py | tee coindcx_signal_output.txt
        python ARVIND_COINDCX_TELEGRAM_NOTIFY.py coindcx coindcx_signal_output.txt
