# expert_paper.py: PAPER test of expert_crypto_strategy.py on all coins with 24h volume >= 15M USDT.
# No real orders. Runs every 15 minutes, right after each 15m candle closes.
name: expert_paper (expert strategy, PAPER, 24h vol >= 15M)

on:
  workflow_dispatch:
  schedule:
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: write

concurrency:
  group: expert-paper
  cancel-in-progress: false

jobs:
  expert:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      EXPERT_MIN_VOL: "15000000"
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests numpy pandas
      - name: Run one expert paper scan
        run: python -u expert_paper.py
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in expert_paper_state.json expert_paper_trades.csv; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "Update expert paper state"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
