# expert_paper.py: PAPER test of expert_crypto_strategy.py on all coins with 24h volume >= 15M USDT.
# No real orders. Runs every 15 minutes, right after each 15m candle closes.
name: expert_paper (expert strategy, PAPER, 24h vol >= 15M)

on:
  workflow_dispatch:
  schedule:
    - cron: "35 */3 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: expert-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      EXPERT_MIN_VOL: "15000000"
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests numpy pandas
      - name: Run every closed 15m candle for ~5.5 hours (GitHub cron alone was firing only every ~6 h)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          persist() {
            for f in expert_paper_state.json expert_paper_trades.csv; do [ -f "$f" ] && git add "$f"; done
            if git diff --cached --quiet; then
              git pull --rebase --autostash origin main >/dev/null 2>&1 || true
              return 0
            fi
            git commit -m "Update expert paper state" || return 0
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main >/dev/null 2>&1 && git push origin HEAD:main && return 0
              sleep $((i * 5))
            done
            echo "WARN: could not push state"
          }
          END=$(( $(date +%s) + 19800 ))
          cycle=0
          while [ "$(date +%s)" -lt "$END" ]; do
            NOW=$(date +%s)
            NEXT=$(( (NOW / 900 + 1) * 900 + 60 ))
            if [ "$cycle" -gt 0 ] || [ $(( NOW % 900 )) -gt 300 ]; then sleep $((NEXT - NOW)); fi
            cycle=$((cycle + 1))
            echo "=== expert paper cycle $cycle @ $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            timeout 700 python -u expert_paper.py || echo "WARN: cycle $cycle failed"
            persist
          done
      - name: Re-dispatch next run
        if: success() || failure()
        run: gh workflow run expert_paper.yml --repo "${{ github.repository }}" --ref main
