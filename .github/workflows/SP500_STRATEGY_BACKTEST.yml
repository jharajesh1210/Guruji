# One-off research run: backtests RSI(2) mean reversion vs gap-down fill on SPY daily data.
# Manual trigger only. Results appear in the run's "Summary" tab and as a downloadable artifact.
# It does not touch the live paper-trading state files or push anything to the repo.
name: SP500 Strategy Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests yfinance
      - name: Run backtest
        run: python -u sp500_strategies_backtest.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp500_backtest_results_${{ github.run_number }}
          path: sp500_results/
          if-no-files-found: warn
          retention-days: 30
