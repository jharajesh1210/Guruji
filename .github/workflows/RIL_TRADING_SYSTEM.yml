
name: RELIANCE 5MIN PAPER AND BACKTEST

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Select trading mode"
        required: true
        default: "paper"
        type: choice
        options:
          - paper
          - backtest

  schedule:
    - cron: "*/5 3-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: reliance-paper-state
  cancel-in-progress: false

jobs:
  reliance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests yfinance

      - name: Check Python Script
        run: |
          test -f RIL_TRADING_SYSTEM.PY
          python -m py_compile RIL_TRADING_SYSTEM.PY

      - name: Run RELIANCE Paper Trading
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MODE: ${{ github.event.inputs.mode || 'paper' }}
        run: |
          set -o pipefail

          if [ "$MODE" = "backtest" ]; then
            python -u RIL_TRADING_SYSTEM.PY \
              --mode backtest \
              --days 59 | tee RELIANCE_RUN_LOG.txt
          else
            python -u RIL_TRADING_SYSTEM.PY \
              --mode paper | tee RELIANCE_RUN_LOG.txt
          fi

      - name: Save Paper Trading State
        if: >
          success() &&
          (github.event_name == 'schedule' ||
          github.event.inputs.mode == 'paper')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in \
            RELIANCE_PAPER_STATE.json \
            RELIANCE_PAPER_TRADES.csv \
            RELIANCE_PAPER_EVENTS.csv
          do
            if [ -f "$f" ]; then
              git add -f "$f"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "Update RELIANCE paper state [skip ci]"
            git push
          else
            echo "No changes to save"
          fi

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RELIANCE_PAPER_BACKTEST_REPORTS
          path: |
            RELIANCE_RUN_LOG.txt
            RELIANCE_PAPER_STATE.json
            RELIANCE_PAPER_TRADES.csv
            RELIANCE_PAPER_EVENTS.csv
            RELIANCE_ORB_TRADES.csv
            RELIANCE_EMA_VWAP_TRADES.csv
            RELIANCE_ALL_TRADES.csv
          if-no-files-found: warn
          retention-days: 30
