
name: RELIANCE 5MIN BACKTEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliance-backtest:
    name: RELIANCE ORB and EMA VWAP Backtest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Check Python script
        run: |
          test -f RIL_TRADING_SYSTEM.py
          python -m py_compile RIL_TRADING_SYSTEM.py

      - name: Run real 5-minute Yahoo backtest
        run: |
          set -o pipefail
          python -u RIL_TRADING_SYSTEM.py --source yfinance --strategy all --days 59 | tee reliance_backtest_log.txt

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RELIANCE_5MIN_BACKTEST_LOG
          path: reliance_backtest_log.txt
          if-no-files-found: warn
          retention-days: 30
