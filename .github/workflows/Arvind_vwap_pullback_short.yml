
name: Arvind VWAP Pullback SHORT - Yahoo Finance

on:
  workflow_dispatch:

  schedule:
    # NSE market hours, Monday-Friday
    # Times are UTC
    - cron: "45-59/5 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"

permissions:
  contents: read

concurrency:
  group: arvind-vwap-pullback-short
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free Yahoo Finance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance pandas numpy requests pytz

      - name: Download Reliance and Nifty 5m data
        run: |
          python - <<'PYCODE'
          import yfinance as yf
          import pandas as pd

          symbols = [
              ("RELIANCE.NS", "RELIANCE_5m.csv"),
              ("^NSEI", "NIFTY_5m.csv")
          ]

          for ticker, filename in symbols:
              print("Downloading:", ticker)

              df = yf.download(
                  ticker,
                  period="30d",
                  interval="5m",
                  auto_adjust=False,
                  progress=False,
                  threads=False
              )

              if df.empty:
                  raise RuntimeError(
                      f"No Yahoo data for {ticker}"
                  )

              if isinstance(df.columns, pd.MultiIndex):
                  df.columns = df.columns.get_level_values(0)

              df.columns = [
                  str(c).lower() for c in df.columns
              ]

              if df.index.tz is None:
                  raise RuntimeError(
                      f"Missing timezone for {ticker}"
                  )

              df.index = (
                  df.index.tz_convert("Asia/Kolkata")
                  .tz_localize(None)
              )

              df.index.name = "datetime"
              df = df.reset_index()

              required = [
                  "datetime",
                  "open",
                  "high",
                  "low",
                  "close",
                  "volume"
              ]

              df = df[required].dropna()

              df = df[
                  (df["datetime"].dt.hour * 60
                   + df["datetime"].dt.minute >= 555)
                  &
                  (df["datetime"].dt.hour * 60
                   + df["datetime"].dt.minute <= 925)
              ]

              if df.empty:
                  raise RuntimeError(
                      f"No valid 5m data for {ticker}"
                  )

              df.to_csv(filename, index=False)

              print(
                  filename,
                  "candles:",
                  len(df)
              )
          PYCODE

      - name: Run existing Arvind strategy with RR4
        env:
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Kolkata
        run: |
          python Arvind_vwap_pullback_short.py \
            --reliance RELIANCE_5m.csv \
            --nifty NIFTY_5m.csv \
            --out arvind_vwap_rr4_trades.csv

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvind-vwap-short-rr4-results
          path: |
            arvind_vwap_rr4_trades.csv
            RELIANCE_5m.csv
            NIFTY_5m.csv
          if-no-files-found: warn
          retention-days: 30
