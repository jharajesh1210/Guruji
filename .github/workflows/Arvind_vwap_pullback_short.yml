
name: Arvind VWAP Pullback SHORT - Yahoo Finance

on:
  workflow_dispatch:

  schedule:
    # Monday to Friday, every 5 minutes
    # 09:15 AM to 03:30 PM IST
    # GitHub cron uses UTC
    - cron: "45-59/5 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: arvind-vwap-pullback-short
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free Yahoo Finance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            yfinance \
            pandas \
            numpy \
            requests \
            pytz

      - name: Run existing Arvind VWAP SHORT strategy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Kolkata
        run: |
          echo "Starting Arvind VWAP Pullback SHORT"
          python Arvind_vwap_pullback_short.py

      - name: Upload scanner results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arvind-vwap-short-results
          path: |
            *.csv
            *.json
          if-no-files-found: ignore
          retention-days: 30
