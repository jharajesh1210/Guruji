name: GOLD FINAL Paper Trading
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      send_status:
        description: "Send Telegram status test (not a trade)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: gold-final-paper
  cancel-in-progress: false
jobs:
  gold-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas numpy requests
      - name: Compile check
        run: python -m py_compile GOLD_FINAL_PAPER.py
      - name: Fetch verified news and funding evidence
        env:
          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json, os, requests
          from pathlib import Path
          now=dt.datetime.now(dt.timezone.utc)
          key=os.getenv("TRADING_ECONOMICS_API_KEY","").strip()
          if key:
              try:
                  start=now.date().isoformat()
                  end=(now+dt.timedelta(days=2)).date().isoformat()
                  r=requests.get("https://api.tradingeconomics.com/calendar/country/united states/"+start+"/"+end,
                      params={"c":key,"f":"json"},timeout=25)
                  r.raise_for_status()
                  rows=r.json()
                  if not isinstance(rows,list): raise ValueError("Unexpected economic calendar response")
                  events=[]
                  for item in rows:
                      if not isinstance(item,dict) or str(item.get("Importance","")) not in ("3","High"): continue
                      stamp=item.get("Date")
                      if not stamp: raise ValueError("High-impact event without timestamp")
                      moment=dt.datetime.fromisoformat(stamp.replace("Z","+00:00"))
                      if moment.tzinfo is None: raise ValueError("Economic event timestamp has no timezone")
                      moment=moment.astimezone(dt.timezone.utc)
                      events.append({"start":moment.isoformat(),"end":moment.isoformat(),"title":str(item.get("Event",""))})
                  Path("GOLD_NEWS_WINDOWS.json").write_text(json.dumps({
                      "verified_until":(now+dt.timedelta(minutes=15)).isoformat(),
                      "events":events,"source":"Trading Economics live calendar"},indent=2))
                  print("NEWS VERIFIED: "+str(len(events))+" high-impact events")
              except Exception as e:
                  print("::warning::NEWS NOT VERIFIED: "+str(e))
          else:
              print("::warning::NEWS NOT VERIFIED: TRADING_ECONOMICS_API_KEY secret absent")
          try:
              r=requests.get("https://public.coindcx.com/market_data/v3/current_prices/futures/rt",timeout=25)
              r.raise_for_status()
              data=r.json()
              prices=data["prices"]
              result={}
              for symbol in ("XAU","PAXG"):
                  matches=[(p,v) for p,v in prices.items() if p.endswith("-"+symbol+"_USDT")]
                  if len(matches)!=1: raise ValueError(symbol+" futures quote missing or ambiguous")
                  pair,quote=matches[0]
                  rate=float(quote["fr"])
                  mark=float(quote["mp"])
                  last=float(quote["ls"])
                  if not all(map(__import__("math").isfinite,(rate,mark,last))) or mark<=0 or last<=0:
                      raise ValueError(symbol+" invalid price/funding")
                  timestamp=int(quote.get("bmST",0))
                  if timestamp<=0 or abs(now.timestamp()*1000-timestamp)>300000:
                      raise ValueError(symbol+" stale quote")
                  result[symbol]={"pair":pair,"funding_rate":rate,"mark_price":mark,"last_price":last}
              # Mark-vs-last is not verified index basis. Never set basis_verified to true.
              Path("GOLD_FUNDING_OBSERVATIONS.json").write_text(json.dumps({
                  "checked_at":now.isoformat(),"source":"CoinDCX public realtime futures",
                  "funding_observations":result,"basis_verified":False},indent=2))
              print("FUNDING OBSERVED: XAU and PAXG; INDEX BASIS NOT VERIFIED")
          except Exception as e:
              print("::warning::FUNDING NOT VERIFIED: "+str(e))
          PY
      - name: Validate mandatory live safety data
        continue-on-error: true
        run: |
          python - <<'PY'
          import datetime as dt,json
          from pathlib import Path
          now=dt.datetime.now(dt.timezone.utc)
          errors=[]
          try:
              news=json.loads(Path("GOLD_NEWS_WINDOWS.json").read_text())
              until=dt.datetime.fromisoformat(news["verified_until"].replace("Z","+00:00"))
              if until.tzinfo is None or until<now or not isinstance(news["events"],list):
                  raise ValueError("expired or invalid news")
          except (OSError,ValueError,KeyError,TypeError) as e:
              errors.append("Verified economic calendar missing/expired: "+str(e))
          try:
              market=json.loads(Path("GOLD_MARKET_FILTERS.json").read_text())
              checked=dt.datetime.fromisoformat(market["checked_at"].replace("Z","+00:00"))
              if checked.tzinfo is None or abs((now-checked).total_seconds())>300:
                  raise ValueError("stale snapshot")
              if not all(market.get(k) is True for k in ("basis_verified","funding_verified","basis_ok")):
                  raise ValueError("basis/funding not independently verified")
              if not all(market.get("funding_ok",{}).get(k) is True for k in ("XAU","PAXG")):
                  raise ValueError("XAU/PAXG funding verification missing")
          except (OSError,ValueError,KeyError,TypeError,AttributeError) as e:
              errors.append("Verified basis/funding gate blocked: "+str(e))
          for error in errors: print("::warning::GOLD PAPER SAFETY BLOCK: "+error)
          if not errors: print("GOLD PAPER SAFETY DATA VALIDATED")
          PY
      - name: CoinDCX paper engine
        env:
          TG_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.CHAT_ID }}
          GOLD_CAPITAL: "1000"
          GOLD_POSITION_USDT: "500"
          GOLD_REQUESTED_LEVERAGE: "30"
        run: python GOLD_FINAL_PAPER.py
      - name: Save paper position and trade history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GOLD_FINAL_PAPER_STATE.json GOLD_FINAL_PAPER_TRADES.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update GOLD paper state [skip ci]"
            git push
          fi
      - name: Telegram test on manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_status }}
        env:
          TG_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os,requests
          token=os.getenv("TG_TOKEN"); chat=os.getenv("TG_CHAT_ID")
          if not token or not chat: raise SystemExit("TG_TOKEN or TG_CHAT_ID missing")
          r=requests.post(f"https://api.telegram.org/bot{token}/sendMessage",data={"chat_id":chat,"text":"GOLD FINAL PAPER: GitHub manual test. This is NOT a trade confirmation."},timeout=20)
          r.raise_for_status()
          print("Telegram test delivered to API")
          PY
