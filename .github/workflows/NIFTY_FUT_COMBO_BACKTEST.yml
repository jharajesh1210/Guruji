name: NIFTY FUT COMBO Historical Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical lookback (current near-month NIFTY futures contract)"
        type: choice
        options:
          - "30"
          - "60"
        default: "60"
        required: true

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install smartapi-python pyotp requests pandas numpy logzero websocket-client pycryptodome
      - name: Verify Angel One credentials
        shell: bash
        run: |
          test -n "$ANGEL_API_KEY" && test -n "$ANGEL_CLIENT_CODE" && test -n "$ANGEL_PIN" && test -n "$ANGEL_TOTP_SECRET" || { echo "Missing Angel One secrets"; exit 1; }
      - name: Run historical backtest
        shell: bash
        run: |
          DAYS='${{ github.event.inputs.days }}'
          python -u NIFTY_FUT_COMBO.py backtest --fetch --days "$DAYS" --save-trades NIFTY_FUT_COMBO_BACKTEST_TRADES.csv 2>&1 | tee NIFTY_FUT_COMBO_BACKTEST_REPORT.txt
      - name: Upload backtest report and trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY-FUT-COMBO-Backtest
          path: |
            NIFTY_FUT_COMBO_BACKTEST_REPORT.txt
            NIFTY_FUT_COMBO_BACKTEST_TRADES.csv
          if-no-files-found: warn
          retention-days: 30
