# PART-06 (liquidity sweep + ORB + PDH/PDL, multi-candle sweep detection): CoinDCX paper trader with NY (DST-aware), London and Asia (Tokyo) sessions, fixed-risk sizing, risk filter, correlation limits, cluster guard and session-day loss breaker.
# sessions, fixed-risk sizing, risk filter and correlation limits. Separate from PART-01 (COINDCX_ORB_PDH_NY_SESSION.yml)
# and PART-02 (COINDCX_ORB_PDH_NY_PART02.yml).
# Self-sustaining chain (like PART-01/02): GitHub's cron is best-effort and often skipped, so every run loops ~5.5h and
# re-dispatches itself, keeping one run alive all day. The scanner runs from 23:50 UTC (10 min before Asia opens at
# 00:00 UTC) until 21:10 UTC (after the NY close); it only idles 21:10-23:50 UTC. The cron below is only a backup
# starter. Paper only: no orders are placed.
name: CoinDCX ORB PDH PART-06 (NY+London+Asia) Paper Trading

on:
  workflow_dispatch:
    inputs:
      force_one_cycle:
        description: "Run exactly one scan cycle even outside the trading window (smoke test)"
        type: boolean
        default: false
  schedule:
    - cron: "30 */3 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: coindcx-orb-pdh-part06
  cancel-in-progress: false

jobs:
  live-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      FORCE: ${{ inputs.force_one_cycle }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository and restore paper state
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests
      - name: Compile strategy
        run: python -m py_compile "coindcx_orb_pdh_ny_session_PART-06.py"
      - name: Run PART-06 scanner loop (every 5 min inside the trading window)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          persist() {
            for f in orb_pdh_part6_state.json orb_pdh_part6_trades.csv eligible_futures_universe_part6.csv; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            if git diff --cached --quiet; then
              return 0
            fi
            git commit -m "Update CoinDCX ORB PART-06 paper state" || return 0
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main >/dev/null 2>&1 || true
              if git push origin HEAD:main; then
                return 0
              fi
              sleep $((attempt * 3))
            done
            echo "WARN: could not push state this cycle; will retry next cycle."
            return 0
          }

          END=$(( $(date +%s) + 19800 ))
          cycle=0
          while [ "$(date +%s)" -lt "$END" ]; do
            hm=$((10#$(date -u +%H%M)))
            START=$(date +%s)
            # Idle window (UTC): after the NY close (21:10) until just before Asia opens (23:50).
            if [ "$FORCE" != "true" ] && [ "$hm" -ge 2110 ] && [ "$hm" -lt 2350 ]; then
              # Outside the trading window: stay alive (so the chain never breaks) but do not scan.
              NEXT=$(( (START / 300 + 1) * 300 ))
              sleep $((NEXT - START))
              continue
            fi
            cycle=$((cycle + 1))
            echo "=== cycle ${cycle} @ $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            if ! timeout 600 python -u "coindcx_orb_pdh_ny_session_PART-06.py" --mode live-paper; then
              echo "WARN: cycle ${cycle} failed or timed out; continuing."
            fi
            persist
            if [ "$FORCE" = "true" ]; then
              break
            fi
            NEXT=$(( (START / 300 + 1) * 300 ))
            NOW=$(date +%s)
            if [ "$NEXT" -gt "$NOW" ]; then
              sleep $((NEXT - NOW))
            fi
          done
          echo "Loop finished after ${cycle} cycles."
      - name: Re-dispatch to keep the chain alive
        if: success() || failure()
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "Forced test run: no re-dispatch."
          else
            echo "Starting the next run of the chain."
            gh workflow run COINDCX_ORB_PDH_PART06.yml --repo "${{ github.repository }}" --ref main
          fi
