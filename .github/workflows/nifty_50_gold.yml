name: NIFTY 50 GOLD Angel One Paper Scanner
on:
  workflow_dispatch:
    inputs:
      telegram_test:
        description: Send Telegram delivery test before scanning
        required: false
        default: "true"
  schedule:
    - cron: "*/5 3-10 * * 1-5"
permissions:
  contents: write
concurrency:
  group: nifty-50-gold-paper
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install smartapi-python pyotp requests pandas numpy
      - name: Run Angel One NIFTY 50 GOLD paper scanner
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TG_TOKEN: ${{ secrets.TG_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID || secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TELEGRAM_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_test == 'true' && '1' || '0' }}
          PAPER_CAPITAL: "100000"
          RISK_PCT: "0.01"
          MAX_POSITIONS: "3"
          MAX_DAILY_TRADES: "5"
        run: python NIFTY_50_GOLD.py
      - name: Persist paper state and trade log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NIFTY_50_GOLD_STATE.json NIFTY_50_GOLD_TRADES.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update NIFTY 50 GOLD paper trading state"
          git push
