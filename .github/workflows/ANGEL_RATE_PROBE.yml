# Read-only Angel One rate-limit probe (no orders). Run it AFTER market hours, when the Nifty bots are idle.
# Manual button, plus a one-off schedule for 11 Nov at 10:15 UTC (15:45 IST); remove the schedule after use.
name: Angel One Rate Probe

on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 11 11 *"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas numpy requests pyotp logzero websocket-client smartapi-python
      - name: Run probe
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python -u angel_rate_probe.py
