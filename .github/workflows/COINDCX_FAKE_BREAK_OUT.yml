# PART-03: CoinDCX FAKE BREAKOUT paper trader (ORB + PDH/PDL). Both NY and London sessions trade only a confirmed
# fake breakout (breakout candle, then a candle closes back inside the level within 3 candles -> opposite direction,
# stop beyond the spike). Separate from PART-01 (COINDCX_ORB_PDH_NY_SESSION.yml) and PART-02 (COINDCX_ORB_PDH_NY_PART02.yml).
# Self-sustaining chain (like PART-02): GitHub's cron is best-effort and often skipped, so every run loops ~5.5h and
# re-dispatches itself, keeping one run alive all day. The scanner only scans inside the trading window (London open
# 07:50 UTC in winter / 06:50 UTC in summer, to 21:10 UTC); outside it the loop just idles. The cron below is only a
# backup starter. Paper only: no orders are placed.
name: CoinDCX FAKE BREAK OUT PART-03 Paper Trading

on:
  workflow_dispatch:
    inputs:
      force_one_cycle:
        description: "Run exactly one scan cycle even outside the trading window (smoke test)"
        type: boolean
        default: false
  schedule:
    - cron: "20 */3 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: coindcx-fake-break-out
  cancel-in-progress: false

jobs:
  live-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      FORCE: ${{ inputs.force_one_cycle }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository and restore paper state
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests
      - name: Compile strategy
        run: python -m py_compile "FAKE_BREAK_OUT.py"
      - name: Run PART-03 scanner loop (every 5 min inside the trading window)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Window start (UTC, HHMM): 10 min before London opens. London is UTC+1 in summer, UTC+0 in winter.
          window_start() {
            if [ "$(TZ=Europe/London date +%z)" = "+0100" ]; then echo 650; else echo 750; fi
          }

          persist() {
            for f in fake_break_out_state.json fake_break_out_trades.csv eligible_futures_universe_fake_break_out.csv; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            if git diff --cached --quiet; then
              return 0
            fi
            git commit -m "Update CoinDCX FAKE_BREAK_OUT PART-03 paper state" || return 0
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main >/dev/null 2>&1 || true
              if git push origin HEAD:main; then
                return 0
              fi
              sleep $((attempt * 3))
            done
            echo "WARN: could not push state this cycle; will retry next cycle."
            return 0
          }

          END=$(( $(date +%s) + 19800 ))
          cycle=0
          while [ "$(date +%s)" -lt "$END" ]; do
            hm=$((10#$(date -u +%H%M)))
            START=$(date +%s)
            if [ "$FORCE" != "true" ] && { [ "$hm" -lt "$(window_start)" ] || [ "$hm" -ge 2110 ]; }; then
              # Outside the trading window: stay alive (so the chain never breaks) but do not scan.
              NEXT=$(( (START / 300 + 1) * 300 ))
              sleep $((NEXT - START))
              continue
            fi
            cycle=$((cycle + 1))
            echo "=== cycle ${cycle} @ $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            if ! timeout 600 python -u "FAKE_BREAK_OUT.py" --mode live-paper; then
              echo "WARN: cycle ${cycle} failed or timed out; continuing."
            fi
            persist
            if [ "$FORCE" = "true" ]; then
              break
            fi
            NEXT=$(( (START / 300 + 1) * 300 ))
            NOW=$(date +%s)
            if [ "$NEXT" -gt "$NOW" ]; then
              sleep $((NEXT - NOW))
            fi
          done
          echo "Loop finished after ${cycle} cycles."
      - name: Re-dispatch to keep the chain alive
        if: success() || failure()
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "Forced test run: no re-dispatch."
          else
            echo "Starting the next run of the chain."
            gh workflow run COINDCX_FAKE_BREAK_OUT.yml --repo "${{ github.repository }}" --ref main
          fi
