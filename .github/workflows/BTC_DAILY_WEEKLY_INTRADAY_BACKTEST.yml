name: BTC Daily Weekly Intraday Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'BTC_DAILY_WEEKLY_INTRADAY_BACKTEST.py'
      - 'BTC_DAILY_WEEKLY_INTRADAY_PAPER.py'
      - '.github/workflows/BTC_DAILY_WEEKLY_INTRADAY_BACKTEST.yml'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run 30-day BTC 5-minute backtest
        env:
          COINDCX_PAIR: B-BTC_USDT
          CAPITAL_PER_TRADE_USDT: '100'
          HISTORY_DAYS: '30'
          FEE_RATE: '0.0005'
          SLIPPAGE_RATE: '0.0002'
        run: python -u BTC_DAILY_WEEKLY_INTRADAY_BACKTEST.py
      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTC-5M-30-Day-Backtest
          path: backtest_results/
          if-no-files-found: warn
