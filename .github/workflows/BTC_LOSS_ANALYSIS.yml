
name: BTC LOSS ANALYSIS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install pandas numpy requests

      - name: Run BTC historical analysis
        run: |
          python -u BTC_LOSS_ANALYSIS.py

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTC_LOSS_ANALYSIS_RESULTS
          path: |
            BTC_LOSS_ANALYSIS*.csv
            BTC_LOSS_ANALYSIS*.json
          if-no-files-found: warn
