name: BTC Futures Donchian Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: Historical days to test
        required: true
        default: '365'
      notional:
        description: USDT notional per trade
        required: true
        default: '100'
  push:
    paths:
      - 'BTC_FUTURES_DONCHIAN_BACKTEST.py'
      - '.github/workflows/BTC_FUTURES_DONCHIAN_BACKTEST.yml'
  schedule:
    - cron: '30 1 * * 0'

permissions:
  contents: read

concurrency:
  group: btc-futures-donchian-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run 5-minute BTC futures backtest
        env:
          DAYS: ${{ inputs.days || '365' }}
          NOTIONAL: ${{ inputs.notional || '100' }}
        run: |
          python BTC_FUTURES_DONCHIAN_BACKTEST.py \\
            --days "$DAYS" --capital 1000 --notional "$NOTIONAL" \\
            --fee 0.0005 --slippage 0.0002 --out btc_donchian_results
      - name: Add comparison to run summary
        if: always()
        run: |
          if [ -f btc_donchian_results/comparison.csv ]; then
            echo '### BTC Donchian backtest comparison' >> "$GITHUB_STEP_SUMMARY"
            echo ' `' >> "$GITHUB_STEP_SUMMARY"
            cat btc_donchian_results/comparison.csv >> "$GITHUB_STEP_SUMMARY"
            echo ' `' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload backtest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTC-Futures-Donchian-Backtest
          path: btc_donchian_results/
          if-no-files-found: warn
          retention-days: 30
