name: BTC Daily Weekly Intraday Paper Trading

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: btc-daily-weekly-intraday-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests

      - name: Run BTC 5-minute paper scanner
        env:
          COINDCX_PAIR: B-BTC_USDT
          CAPITAL_PER_TRADE_USDT: '100'
          HISTORY_DAYS: '30'
          POLL_SECONDS: '30'
          TG_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u BTC_DAILY_WEEKLY_INTRADAY_PAPER.py

      - name: Save paper state and history
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in BTC_DAILY_WEEKLY_PAPER_state.json BTC_DAILY_WEEKLY_PAPER_trades.csv BTC_DAILY_WEEKLY_PAPER_signals.csv BTC_DAILY_WEEKLY_PAPER_events.csv; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update BTC daily weekly paper records [skip ci]'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
