name: NIFTY50 ORB PDH PDL 5M PAPER

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 3-10 * * 1-5'

permissions:
  contents: write

concurrency:
  group: nifty50-orb-pdh-paper
  cancel-in-progress: false

jobs:
  nifty50-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository and paper state
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests pyotp smartapi-python
      - name: Compile strategy
        run: python -m py_compile orb_pdh_strategy.py
      - name: Telegram connectivity test (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          test -n "$BOT_TOKEN" || (echo 'Missing BOT_TOKEN secret' && exit 1)
          test -n "$CHAT_ID" || (echo 'Missing CHAT_ID secret' && exit 1)
          python -u orb_pdh_strategy.py test-telegram --capital 50000
      - name: Run one NIFTY50 paper cycle (scheduled only)
        if: github.event_name == 'schedule'
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          set -o pipefail
          python -u orb_pdh_strategy.py paper --capital 50000 2>&1 | tee ORB_PDH_PAPER_LOG.txt
      - name: Persist paper state and records
        if: always() && github.event_name == 'schedule'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in ORB_PDH_PAPER_STATE.json ORB_PDH_PAPER_TRADES.csv ORB_PDH_PAPER_EQUITY.csv ORB_PDH_PAPER_LOG.txt; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update NIFTY50 ORB PDH PDL paper state'
            git push
          else
            echo 'No paper-state changes to persist.'
          fi
      - name: Upload paper logs and records
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY50_ORB_PDH_PAPER_${{ github.run_number }}
          path: |
            ORB_PDH_PAPER_LOG.txt
            ORB_PDH_PAPER_STATE.json
            ORB_PDH_PAPER_TRADES.csv
            ORB_PDH_PAPER_EQUITY.csv
          if-no-files-found: warn
          retention-days: 30
