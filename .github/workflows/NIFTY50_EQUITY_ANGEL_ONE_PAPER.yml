name: NIFTY50 Equity Angel One Paper Trading

on:
  schedule:
    # IST 09:15-15:00, Monday-Friday (GitHub cron uses UTC).
    - cron: "45,50,55 3 * * 1-5"
    - cron: "*/5 4-8 * * 1-5"
    - cron: "0,5,10,15,20,25,30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nifty50-equity-angel-one-paper
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install smartapi-python pyotp pandas numpy requests logzero websocket-client

      - name: Compile check
        run: python -m py_compile NIFTY50_EQUITY_INTRADAY_ANGEL_ONE.py

      - name: Run Angel One paper scanner
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          ANGEL_NIFTY_TOKEN: ${{ secrets.ANGEL_NIFTY_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRESH_MAX_AGE: "900"
        run: python NIFTY50_EQUITY_INTRADAY_ANGEL_ONE.py --mode paper

      - name: Persist paper state and reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NIFTY50_EQUITY_PAPER_STATE.json NIFTY50_EQUITY_PAPER_TRADES.csv NIFTY50_EQUITY_PAPER_EVENTS.csv NIFTY50_EQUITY_SIGNALS.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update NIFTY50 Angel One paper trading state"
            git push
          else
            echo "No paper state/report changes to commit"
          fi
