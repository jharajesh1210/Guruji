name: ALL BOTS STATUS (Telegram)

# Sends one Telegram message with the last run result of every bot in this repo.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"  # Daily 08:00 IST

permissions:
  actions: read
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send status report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          from datetime import datetime, timedelta, timezone

          repo = os.environ["REPO"]
          hdr = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"}

          def get(url):
              req = urllib.request.Request(url, headers=hdr)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          ist = timezone(timedelta(hours=5, minutes=30))
          wfs = get(f"https://api.github.com/repos/{repo}/actions/workflows?per_page=100")["workflows"]
          ok, bad, other = [], [], []
          for w in sorted(wfs, key=lambda x: x["name"]):
              if w["path"].endswith("ALL_BOTS_STATUS.yml"):
                  continue
              name = w["name"]
              if w["state"] != "active":
                  other.append(f"⏸ {name} (band)")
                  continue
              runs = get(f"https://api.github.com/repos/{repo}/actions/workflows/{w['id']}/runs?per_page=1")["workflow_runs"]
              if not runs:
                  other.append(f"➖ {name} (abhi tak koi run nahi)")
                  continue
              r = runs[0]
              t = datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")).astimezone(ist).strftime("%d %b %H:%M")
              if r["status"] != "completed":
                  other.append(f"⏳ {name} - chal raha hai ({t})")
              elif r["conclusion"] == "success":
                  ok.append(f"✅ {name} ({t})")
              else:
                  bad.append(f"❌ {name} - {r['conclusion']} ({t})")

          now = datetime.now(ist).strftime("%d %b %Y %H:%M")
          lines = [f"GURUJI - SAB BOTS KA STATUS", f"{now} IST", "",
                   f"Sahi: {len(ok)} | Fail: {len(bad)} | Baaki: {len(other)}", ""]
          lines += bad + other + ok
          lines += ["", "PAPER TRADING ONLY"]
          msg = "\n".join(lines)
          print(msg)

          token, chat = os.environ.get("BOT_TOKEN"), os.environ.get("CHAT_ID")
          if not token or not chat:
              raise SystemExit("Telegram secrets missing")
          data = json.dumps({"chat_id": chat, "text": msg[:4000]}).encode()
          req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data,
                                       headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=20) as r:
              if not json.load(r).get("ok"):
                  raise SystemExit("Telegram delivery failed")
          print("TELEGRAM SENT")
          PY
