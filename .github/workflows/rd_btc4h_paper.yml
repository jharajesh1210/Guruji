# rd_btc4h_paper.py: PAPER test of the BTC 4h logic (4h breakout, ATR SL, MACD loss exit, 1:5 ladder).
# No real orders. Runs every 15 minutes (only acts when a new 4h candle has closed).
name: rd_btc4h_paper (BTC 4h, PAPER)

on:
  workflow_dispatch:
  schedule:
    - cron: "40 */3 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: rd-btc4h-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests numpy pandas
      - name: Run every closed 15m candle for ~5.5 hours (GitHub cron alone was firing only every ~6 h)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          persist() {
            for f in rd_btc4h_state.json rd_btc4h_trades.csv; do [ -f "$f" ] && git add "$f"; done
            if git diff --cached --quiet; then
              git pull --rebase --autostash origin main >/dev/null 2>&1 || true
              return 0
            fi
            git commit -m "Update rd_btc4h paper state" || return 0
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main >/dev/null 2>&1 && git push origin HEAD:main && return 0
              sleep $((i * 5))
            done
            echo "WARN: could not push state"
          }
          END=$(( $(date +%s) + 19800 ))
          cycle=0
          while [ "$(date +%s)" -lt "$END" ]; do
            NOW=$(date +%s)
            NEXT=$(( (NOW / 900 + 1) * 900 + 80 ))
            if [ "$cycle" -gt 0 ] || [ $(( NOW % 900 )) -gt 300 ]; then sleep $((NEXT - NOW)); fi
            cycle=$((cycle + 1))
            echo "=== rd_btc4h paper cycle $cycle @ $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            timeout 700 python -u rd_btc4h_paper.py || echo "WARN: cycle $cycle failed"
            persist
          done
      - name: Re-dispatch next run
        if: success() || failure()
        run: gh workflow run rd_btc4h_paper.yml --repo "${{ github.repository }}" --ref main
