name: Guruji Actions Schedule Heartbeat (Temporary Diagnostic)

on:
  workflow_dispatch:
  schedule:
    - cron: "27 * * * *"

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm scheduled trigger
        run: |
          echo "SCHEDULE_HEARTBEAT_OK"
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "UTC time:"
          date -u
