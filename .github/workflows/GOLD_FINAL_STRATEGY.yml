name: GOLD FINAL STRATEGY v2 - SAFE VALIDATION
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gold-final-strategy-v2
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas numpy requests
      - name: Syntax check
        run: python -m py_compile GOLD_FINAL_STRATEGY.py
      - name: Run fail-closed paper validation
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python GOLD_FINAL_STRATEGY.py
