name: BTC 5M BB Squeeze Live Paper Trading
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: btc-5m-bb-squeeze-paper
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run BTC live-data paper scanner
        env:
          COINDCX_PAIR: B-BTC_USDT
          CAPITAL_PER_TRADE_USDT: '100'
          TG_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u BTC_5M_BB_SQUEEZE_STRATEGY.py
      - name: Save paper state and trade history
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in BTC_5M_BB_SQUEEZE_state.json BTC_5M_BB_SQUEEZE_trades.csv BTC_5M_BB_SQUEEZE_signals.csv; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update BTC 5m paper state [skip ci]'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
